name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up measured Python version
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.6"
          cache: "pip"
          cache-dependency-path: track_2a/requirements-lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r track_2a/requirements-lock.txt

      - name: Run unit test suite
        run: |
          make test

  docker:
    name: Validate Docker Build & Container Entrypoint
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build --platform linux/amd64 -t hackapertus-track2a .

      - name: Verify Docker container entrypoint & test suite
        run: |
          docker run --rm hackapertus-track2a test
          docker run --rm --network none --read-only --tmpfs /tmp hackapertus-track2a --help
