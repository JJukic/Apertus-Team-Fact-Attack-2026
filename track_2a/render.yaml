services:
  - type: web
    name: fact-attack-2026
    runtime: python
    rootDir: track_2a
    buildCommand: "pip install -r requirements.txt && python -m src.download_data"
    startCommand: "streamlit run app.py --server.port $PORT --server.address 0.0.0.0"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: "https://api.inference.cscs.ch/v1"
      - key: LLM_NAME
        value: "swiss-ai/Apertus-v1.5-70B-thinking"
